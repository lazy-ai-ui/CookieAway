      <circle cx="5.4" cy="11.2" r="0.95" fill="#000" />
      <circle cx="11.6" cy="6.3" r="0.8" fill="#000" />
    </mask>
  </defs>
  <circle cx="8" cy="8.2" r="7" mask="url(#cookie)" />
</svg>
