<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Popup playground</title>
    <link rel="stylesheet" href="build/popup/popup.css">
    <style>
        html { background: #888; }
        body { margin: 24px auto; background: Canvas; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.3); overflow: hidden; }
    </style>
    <script>
        // Minimal mock of the extension APIs the popup uses. ?url=… sets the active tab.
        const params = new URLSearchParams(location.search);
        const store = { whitelist: ['spiegel.de', 'bbc.co.uk', 'theguardian.com'], rejectedCount: 1284, problems: [], pausedUntil: 0 };
        const session = { paused: false };
        const listeners = [];
        window.browser = {
            tabs: {
                query: async () => [{ id: 1, url: params.get('url') ?? 'https://www.adidas.nl/nl/schoenen' }],
                reload: (id) => console.log('reload tab', id),
            },
            storage: {
                session: { get: async (keys) => Object.fromEntries(keys.map((k) => [k, session[k]])) },
                local: {
                    get: async (keys) => Object.fromEntries(keys.map((k) => [k, structuredClone(store[k])])),
                    set: async (o) => {
                        Object.assign(store, o);
                        listeners.forEach((f) => f(o, 'local'));
                    },
                },
                onChanged: { addListener: (f) => listeners.push(f) },
            },
            runtime: {
                sendMessage: async ({ type, site, whitelisted, url, mode }) => {
                    if (type === 'cookieaway:setPause') {
                        store.pausedUntil = mode === 'hour' ? Date.now() + 3600e3 : 0;
                        session.paused = mode === 'session';
                        listeners.forEach((f) => f({}, 'local'));
                        return {};
                    }
                    if (type === 'cookieaway:reportProblem') {
                        store.problems = [...store.problems, { site: new URL(url).hostname, frames: [{ frameId: 0, lifecycle: 'nothingDetected' }] }];
                        listeners.forEach((f) => f({ problems: {} }, 'local'));
                        return {};
                    }
                    const rest = store.whitelist.filter((s) => s !== site);
                    store.whitelist = whitelisted ? [...rest, site] : rest;
                    listeners.forEach((f) => f({ whitelist: {} }, 'local'));
                    return { ok: true };
                },
            },
        };
    </script>
    <script src="build/popup/popup.js" defer></script>
</head>
<body>
    <section class="site">
        <label class="row">
            <span class="site-text">
                <span class="title">Работать на этом сайте</span>
                <span class="host" id="host"></span>
            </span>
            <input type="checkbox" class="switch" id="enabled" role="switch" disabled>
        </label>
        <button class="link" id="report" disabled>Баннер не закрылся</button>
    </section>

    <section class="pause" id="pause">
        <span id="pause-state">Пауза везде:</span>
        <span class="actions" id="pause-actions">
            <button class="link" data-pause="hour">На час</button>
            <button class="link" data-pause="session">До перезапуска Safari</button>
        </span>
        <button class="link" id="resume" hidden>Снять паузу</button>
    </section>

    <section class="stat">
        Отклонено баннеров: <span class="count" id="count">0</span>
    </section>

    <section class="exceptions">
        <h2>Исключения</h2>
        <ul id="whitelist"></ul>
        <p class="empty" id="empty">Пока нет. Сайты попадают сюда через переключатель выше или «Не трогать этот сайт» в плашке.</p>
    </section>

    <section class="problems" id="problems" hidden>
        <span>Проблемы: <span class="count" id="problem-count">0</span></span>
        <span class="actions">
            <button class="link" id="copy">Скопировать</button>
            <button class="link" id="clear">Очистить</button>
        </span>
    </section>
</body>
</html>
